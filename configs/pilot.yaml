# Edit this only after a successful smoke test and a literature/protocol review.
experiment:
  name: sequential_pilot
  seed: 17
  output_dir: results/runs/sequential_pilot
model:
  name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  revision: REPLACE_WITH_40_CHAR_COMMIT_SHA
  device: auto
  max_length: 256
data:
  input_jsonl: data/your_dataset.jsonl
  version: REPLACE_WITH_FIXED_DATASET_VERSION
  max_forget_examples: 64
  max_forget_update_examples: 64
  max_retain_examples: 64
  max_control_examples: 64
  max_control_update_examples: 64
  max_retain_update_examples: 64
unlearning:
  method: ga
  learning_rate: 0.00001
  max_steps_per_request: 10
  batch_size: 1
  sequence_length: 4
  gradient_accumulation_steps: 1
evaluation:
  primary_structure_metric: cosine_separation
  prompt_template: "{text}"
  fixed_layer: -1
  max_eval_examples_per_split: 64
  generation_max_new_tokens: 32
